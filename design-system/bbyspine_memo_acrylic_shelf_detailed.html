<meta charset="utf-8">

<title>bbyspine.memo — bookshelf prototype</title>

<style>
:root {
  --ink:#171719;
  --muted:#7c7f83;
  --paper:#f5f1e8;
  --paper2:#eee6d8;
  --lav:#a9b2ff;
  --mauve:#9b5f91;
  --navy:#20286f;
  --mint:#87aea1;
  --shelf:#383431;
  --shelf2:#24211f;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  font-family:'Outfit', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 18% 14%,rgba(255,255,255,.18) 0 3%,transparent 3.3%),
    radial-gradient(circle at 78% 10%,rgba(255,255,255,.10) 0 4%,transparent 4.3%),
    linear-gradient(180deg,#2d18ff 0%,#2914f2 40%,#2512db 100%);
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}

/* ===== SHELF DASHBOARD ===== */
.shelf-view{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  padding:24px 32px 30px;
  transition:opacity .28s ease, transform .5s cubic-bezier(.2,.75,.2,1);
}
.shelf-view.hidden{
  opacity:0;
  transform:scale(.985);
  pointer-events:none;
}
.shelf-header{
  height:auto;
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:0 4px 16px;
}
.brand h1{
  margin:0;
  font:italic bold 46px/1 Georgia,"Times New Roman",serif;
  color:#ffc2e3;
  -webkit-text-stroke: 0.8px #ff2cb4;
  text-shadow:0 1.5px 0 rgba(0,0,0,.18);
  letter-spacing:-0.5px;
}
.brand p{
  margin:8px 0 0;
  max-width:520px;
  color:#d6f4f2;
  text-shadow:0 1px 0 rgba(0,0,0,.08);
  font:13px/1.45 Georgia,"Times New Roman",serif;
}
.add-book-btn{
  height:38px;
  padding:0 18px;
  border:1px solid rgba(210,225,255,.62);
  border-radius:19px;
  background:linear-gradient(180deg,#f8fbff,#dce9ff);
  color:#3955be;
  box-shadow:0 8px 18px rgba(20,20,85,.18);
  font-size:12px;
  font-weight:700;
}
.add-book-btn span{font-size:14px;margin-right:5px;vertical-align:-1px}

.library{
  flex:1;min-height:0;
  display:flex;align-items:flex-end;justify-content:center;
  padding:0 2vw 34px;
}
.shelf-wrap{
  width:min(1460px,96vw);
  position:relative;
}
.books{
  width:max-content;
  max-width:min(920px,88vw);
  margin:0 auto;
  min-height:402px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:4px;
  padding:0 22px 6px;
  perspective:1500px;
}
.book-spine{
  position:relative;
  flex:none;
  width:var(--w);
  height:var(--h);
  border:1px solid rgba(26,25,25,.22);
  border-radius:2px 3px 2px 2px;
  transform:translateY(var(--lift)) rotate(var(--tilt));
  transform-origin:bottom center;
  box-shadow:
    inset 4px 0 rgba(255,255,255,.12),
    inset -3px 0 rgba(0,0,0,.10),
    2px 6px 10px rgba(36,30,29,.14);
  overflow:hidden;
  transition:
    transform .35s cubic-bezier(.2,.8,.2,1),
    filter .25s ease;
  color:var(--txt);
}
.book-spine:hover{
  transform:translateY(calc(var(--lift) - 14px)) rotate(var(--tilt));
  filter:brightness(1.04);
}
.book-spine::before{
  content:"";
  position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(255,255,255,.18),transparent 13%,transparent 85%,rgba(0,0,0,.12)),
    repeating-linear-gradient(0deg,transparent 0 16px,rgba(255,255,255,.035) 16px 17px);
  pointer-events:none;
}
.spine-title{
  position:absolute;
  top:15px;left:50%;
  height:calc(100% - 30px);
  writing-mode:vertical-rl;
  transform:translateX(-50%);
  text-orientation:mixed;
  font-family:var(--font);
  font-size:var(--fs);
  font-style:var(--fontStyle,normal);
  font-weight:var(--fontWeight,700);
  line-height:var(--lineHeight,1);
  letter-spacing:var(--letter,.04em);
  text-transform:var(--case,none);
  text-align:left;
  overflow:hidden;
}
.spine-year{
  position:absolute;
  bottom:12px;left:50%;
  transform:translateX(-50%);
  font:7px/1 Tahoma,Arial,sans-serif;
  opacity:.72;
}
.book-spine.horizontal .spine-title{
  writing-mode:horizontal-tb;
  width:100%;
  height:auto;
  left:0;top:18px;
  transform:none;
  padding:0 8px;
  text-align:center;
  line-height:1.1;
}
.shelf-board{
  position:relative;
  height:31px;
  margin-top:0;
  border:1px solid rgba(236,245,255,.96);
  border-radius:8px;
  clip-path:polygon(1.8% 0, 98.2% 0, 100% 24%, 100% 100%, 0 100%, 0 24%);
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.22) 0%,
      rgba(138,158,255,.14) 12%,
      rgba(78,92,255,.28) 20%,
      rgba(53,67,238,.50) 58%,
      rgba(34,45,187,.44) 76%,
      rgba(218,231,255,.18) 100%
    );
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.30),
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -2px 0 rgba(197,221,255,.28),
    0 8px 18px rgba(12,18,105,.12),
    0 0 10px rgba(115,223,255,.14),
    0 0 12px rgba(245,122,255,.08);
  backdrop-filter:blur(2px) saturate(1.14);
  -webkit-backdrop-filter:blur(2px) saturate(1.14);
  overflow:visible;
}

.shelf-board::before{
  content:"";
  position:absolute;
  left:16px;
  right:16px;
  top:5px;
  bottom:9px;
  border-radius:5px;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.12) 0%,
      rgba(81,98,255,.18) 26%,
      rgba(33,48,226,.34) 100%
    );
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.80),
    inset 0 -1px 0 rgba(255,255,255,.12),
    0 0 0 1px rgba(255,255,255,.18);
  opacity:.98;
  pointer-events:none;
}

.shelf-board::after{
  content:"";
  position:absolute;
  left:18px;
  right:18px;
  bottom:5px;
  height:5px;
  border-radius:999px;
  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.92) 0%,
      rgba(196,239,255,.78) 20%,
      rgba(255,255,255,.96) 50%,
      rgba(255,208,246,.70) 80%,
      rgba(255,255,255,.92) 100%
    );
  box-shadow:
    0 0 4px rgba(255,255,255,.30),
    0 0 10px rgba(122,225,255,.15);
  pointer-events:none;
}

.book-spine{
  position:relative;
  isolation:isolate;
}
.book-spine[data-pattern="grid"]{
  background-image:
    linear-gradient(90deg,rgba(255,255,255,.18) 0 8%,transparent 8% 92%,rgba(0,0,0,.14) 92% 100%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.10) 0 2px,transparent 2px 8px),
    repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.10) 6px 7px);
}
.book-spine[data-pattern="dots"]{
  background-image:
    linear-gradient(90deg,rgba(255,255,255,.18) 0 8%,transparent 8% 92%,rgba(0,0,0,.14) 92% 100%),
    radial-gradient(circle,rgba(255,255,255,.16) 0 1px,transparent 1.2px);
  background-size:auto,11px 11px;
}
.book-spine[data-pattern="collage"]{
  background-image:
    linear-gradient(90deg,rgba(255,255,255,.12) 0 7%,transparent 7% 93%,rgba(0,0,0,.16) 93% 100%),
    linear-gradient(18deg,rgba(255,240,191,.60) 0 16%,transparent 16% 33%,rgba(144,225,255,.38) 33% 56%,transparent 56% 74%,rgba(255,165,209,.40) 74% 100%),
    linear-gradient(180deg,transparent,transparent);
}
.book-spine[data-pattern="label"]::after{
  content:"";
  position:absolute;
  left:8px; right:8px; top:20px;
  height:54px;
  background:rgba(255,255,255,.80);
  border:1px solid rgba(0,0,0,.09);
  z-index:0;
}
.book-spine[data-pattern="label"] .spine-title{
  z-index:1;
  color:#1d2024 !important;
}
.book-spine[data-pattern="barcode"]::after{
  content:"";
  position:absolute;
  left:8px;
  right:8px;
  bottom:34px;
  height:44px;
  background:
    repeating-linear-gradient(90deg,#fff 0 3px,#111 3px 6px,#fff 6px 8px,#111 8px 10px);
  opacity:.82;
}
.book-spine[data-pattern="split"]{
  background-image:
    linear-gradient(90deg,rgba(255,255,255,.18) 0 8%,transparent 8% 92%,rgba(0,0,0,.14) 92% 100%),
    linear-gradient(180deg,rgba(255,255,255,.10) 0 50%,rgba(0,0,0,.14) 50% 100%);
}
.book-spine[data-pattern="paper"]{
  background-image:
    linear-gradient(90deg,rgba(255,255,255,.16) 0 8%,transparent 8% 92%,rgba(0,0,0,.12) 92% 100%),
    repeating-linear-gradient(0deg,rgba(78,54,44,.07) 0 2px,rgba(255,255,255,.02) 2px 7px);
}
.book-spine .badge{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:10px;
  min-width:20px;
  padding:2px 4px;
  border-radius:10px;
  background:rgba(255,255,255,.82);
  color:#26272c;
  font:700 6px/1 Tahoma,Arial,sans-serif;
  z-index:2;
}
.book-spine .band{
  position:absolute;
  left:0; right:0; bottom:12px;
  height:14px;
  background:rgba(255,255,255,.20);
  z-index:1;
}

.book-spine.image-book{
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  overflow:hidden;
}
.book-spine.image-book::before{
  display:none;
}
.book-spine.image-book .spine-title,
.book-spine.image-book .spine-year,
.book-spine.image-book .badge,
.book-spine.image-book .band{
  display:none;
}

.book-spine .band.alt{
  top:auto;
  bottom:40px;
  height:10px;
  background:rgba(0,0,0,.16);
}

.shelf-shadow{
  position:absolute;
  left:12%;
  right:12%;
  bottom:-18px;
  height:12px;
  border-radius:50%;
  background:rgba(14,24,116,.05);
  filter:blur(10px);
}

/* ===== ADD BOOK MODAL ===== */
.backdrop{
  position:fixed;inset:0;z-index:200;
  display:none;
  background:rgba(10, 11, 16, 0.45);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.backdrop.open{display:block}
.add-modal{
  position:fixed;
  z-index:210;
  left:50%;top:50%;
  width:min(430px,calc(100vw - 34px));
  transform:translate(-50%,-50%) scale(.97);
  display:none;
  overflow:hidden;
  border:1px solid rgba(255, 255, 255, 0.12);
  border-radius:16px;
  background:rgba(23, 25, 30, 0.85);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 30px 90px rgba(0, 0, 0, 0.4);
}
.add-modal.open{
  display:block;
  animation:modalIn .2s ease forwards;
}
@keyframes modalIn{
  from{opacity:0;transform:translate(-50%,-48%) scale(.97)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
.modal-head{
  padding:20px 24px 16px;
  background:linear-gradient(120deg, rgba(45, 24, 255, 0.12), rgba(255, 159, 216, 0.12));
  border-bottom:1px solid rgba(255, 255, 255, 0.08);
}
.modal-head small{
  display:block;
  margin-bottom:4px;
  color:rgba(255, 255, 255, 0.5);
  font-size:10px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.modal-head h2{
  margin:0;
  color:#ff9fd8;
  font:italic 22px/1 Georgia,"Times New Roman",serif;
  text-shadow:0 1px 1px rgba(0,0,0,.2);
}
.modal-body{padding:24px}
.field label{
  display:block;margin-bottom:8px;
  color:rgba(255, 255, 255, 0.6);
  font-size:11px;
  font-weight:700;
  letter-spacing:0.04em;
  text-transform:uppercase;
}
.field input{
  width:100%;height:38px;
  padding:0 12px;
  border:1px solid rgba(255, 255, 255, 0.1);
  border-radius:8px;
  background:rgba(255, 255, 255, 0.06);
  color:#ffffff;
  outline:none;
  font:13px Georgia,"Times New Roman",serif;
  transition:all 0.2s ease;
}
.field input:focus{
  border-color:#ff9fd8;
  box-shadow:0 0 0 2px rgba(255, 159, 216, 0.2);
  background:rgba(255, 255, 255, 0.1);
}
.cover-picks{
  display:flex;gap:7px;margin-top:16px;
}
.cover-pick{
  width:43px;height:72px;
  border:2px solid transparent;
  border-radius:3px;
  background:var(--c);
  box-shadow:inset 3px 0 rgba(255,255,255,.13),inset -2px 0 rgba(0,0,0,.10);
  transition:transform 0.15s ease, box-shadow 0.15s ease;
}
.cover-pick:hover{
  transform:scale(1.05);
}
.cover-pick.active{
  border-color:#ff9fd8;
  box-shadow:0 0 0 2px rgba(255, 159, 216, 0.3);
}
.book-catalog{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;max-height:280px;overflow:auto;padding:3px}
.catalog-book{display:flex;min-width:0;flex-direction:column;align-items:center;gap:7px;padding:8px 4px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(255,255,255,.06);color:#fff;transition:.15s ease}
.catalog-book:hover{transform:translateY(-2px);background:rgba(255,255,255,.1)}
.catalog-book.active{border-color:#ff9fd8;background:rgba(255,159,216,.12);box-shadow:0 0 0 2px rgba(255,159,216,.2)}
.catalog-cover{width:34px;height:76px;border-radius:2px;background:#252832 center/cover no-repeat;box-shadow:inset 2px 0 rgba(255,255,255,.15),2px 5px 10px rgba(0,0,0,.25)}
.catalog-title{width:100%;overflow:hidden;color:rgba(255,255,255,.72);font:9px/1.2 Georgia,"Times New Roman",serif;text-align:center;text-overflow:ellipsis;white-space:nowrap}
.catalog-empty{grid-column:1/-1;padding:30px 0;color:rgba(255,255,255,.5);font:italic 13px Georgia,serif;text-align:center}
.modal-actions{
  display:flex;justify-content:flex-end;gap:8px;
  margin-top:24px;
}
.modal-actions button{
  height:38px;padding:0 20px;border-radius:19px;
  border:1px solid rgba(255, 255, 255, 0.1);
  background:rgba(255, 255, 255, 0.08);
  color:rgba(255, 255, 255, 0.8);
  font-size:12px;
  font-weight:700;
  transition:background-color 0.2s, border-color 0.2s, color 0.2s, transform 0.1s;
}
.modal-actions button:hover{
  background:rgba(255, 255, 255, 0.15);
  border-color:rgba(255, 255, 255, 0.2);
  color:#ffffff;
}
.modal-actions button:active{
  transform:scale(0.97);
}
.modal-actions .primary{
  border-color:rgba(255, 255, 255, 0.1);
  background:linear-gradient(135deg, #ff9fd8, #8e9ad1);
  color:#17191e;
}
.modal-actions .primary:hover{
  filter:brightness(1.05);
  box-shadow:0 4px 15px rgba(255, 159, 216, 0.3);
  color:#17191e;
}
.modal-actions .primary:disabled{opacity:.38;pointer-events:none}

/* Acrylic shelf identity for the book catalog */
.add-modal{
  width:min(620px,calc(100vw - 34px));
  overflow:visible;
  border:1px solid rgba(220,235,255,.68);
  border-radius:28px;
  background:linear-gradient(145deg,rgba(248,251,255,.78),rgba(205,220,255,.48));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(120,140,220,.18),0 35px 90px rgba(20,20,85,.28),0 8px 24px rgba(255,44,180,.12);
  backdrop-filter:blur(26px) saturate(1.25);
  -webkit-backdrop-filter:blur(26px) saturate(1.25);
}
.add-modal::before{
  content:"";position:absolute;inset:9px 12px auto;height:34%;pointer-events:none;border-radius:20px 20px 50% 50%;
  background:linear-gradient(180deg,rgba(255,255,255,.48),rgba(255,255,255,0));
}
.modal-head{
  position:relative;padding:28px 30px 18px;border:0;background:none;text-align:center;
}
.modal-head::before{
  content:"✦";display:block;margin-bottom:8px;color:#ff2cb4;font-size:15px;text-shadow:0 0 14px rgba(255,44,180,.35);
}
.modal-head small{margin-bottom:6px;color:#3955be;font-size:9px;letter-spacing:.24em}
.modal-head h2{
  color:#ff2cb4;font:italic bold 29px/1.05 Georgia,"Times New Roman",serif;
  text-shadow:0 1px 0 #fff,0 5px 14px rgba(255,44,180,.15);
}
.modal-body{position:relative;padding:8px 28px 24px}
.book-catalog{
  position:relative;display:flex;align-items:flex-end;gap:12px;min-height:180px;max-height:none;overflow-x:auto;overflow-y:hidden;
  padding:20px 18px 18px;border:1px solid rgba(180,204,255,.48);border-radius:20px;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(195,215,255,.2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.72),inset 0 -16px 30px rgba(57,85,190,.05);
  scrollbar-width:thin;scrollbar-color:rgba(57,85,190,.28) transparent;
}
.catalog-book{
  position:relative;z-index:1;flex:0 0 76px;justify-content:flex-end;gap:9px;padding:8px 5px 13px;border-color:transparent;border-radius:12px;
  background:transparent;color:#242d68;box-shadow:none;transform-origin:50% 100%;
  transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .2s,border-color .2s,box-shadow .2s;
}
.catalog-book:hover{transform:translateY(-6px);background:rgba(255,255,255,.34)}
.catalog-book.active{
  transform:translateY(-10px);border-color:rgba(255,44,180,.45);background:rgba(255,255,255,.5);
  box-shadow:0 8px 18px rgba(255,44,180,.15),inset 0 1px rgba(255,255,255,.9);
}
.catalog-cover{
  width:46px;height:112px;border-radius:3px 6px 6px 3px;
  box-shadow:inset 4px 0 rgba(255,255,255,.17),inset -2px 0 rgba(0,0,0,.1),0 8px 13px rgba(25,32,90,.2);
  transition:filter .2s,box-shadow .2s;
}
.catalog-book.active .catalog-cover{box-shadow:inset 4px 0 rgba(255,255,255,.22),inset -2px 0 rgba(0,0,0,.08),0 0 0 3px rgba(255,44,180,.28),0 12px 20px rgba(25,32,90,.22)}
.catalog-title{color:#35457f;font:600 9px/1.2 "Outfit",sans-serif;letter-spacing:.02em}
.catalog-empty{position:relative;z-index:1;width:100%;align-self:center;color:#5264aa;font:italic 15px Georgia,serif}
.modal-actions{align-items:center;justify-content:center;margin-top:20px}
.modal-actions button{
  height:40px;padding:0 21px;border-color:rgba(151,177,231,.5);background:rgba(248,251,255,.55);color:#5264aa;
  box-shadow:inset 0 1px rgba(255,255,255,.8);backdrop-filter:blur(8px);
}
.modal-actions button:hover{border-color:rgba(255,44,180,.34);background:rgba(255,255,255,.78);color:#ff2cb4}
.modal-actions .primary{
  border-color:rgba(255,44,180,.38);background:linear-gradient(180deg,#ffd8ee,#ff9fd8);color:#7e2460;
  box-shadow:inset 0 1px rgba(255,255,255,.8),0 8px 18px rgba(255,44,180,.18);
}
.modal-actions .primary:hover{color:#641849;box-shadow:inset 0 1px rgba(255,255,255,.9),0 10px 22px rgba(255,44,180,.25)}
.modal-actions .primary:disabled{filter:saturate(.45);opacity:.45}

@media (max-width:640px){
  .add-modal{border-radius:22px}
  .modal-head{padding:23px 20px 14px}
  .modal-head h2{font-size:24px}
  .modal-body{padding:6px 16px 18px}
  .book-catalog{min-height:166px;padding-inline:10px}
}

/* ===== CONNECTED BOOK TRANSITION ===== */
.book-transition{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  pointer-events:none;
  perspective:1800px;
}
.book-transition.run{display:block}

.transition-dim{
  position:absolute;
  inset:0;
  background:rgba(19,12,86,0);
  backdrop-filter:blur(0px);
}

.transition-book{
  position:fixed;
  left:0;
  top:0;
  width:40px;
  height:320px;
  transform-origin:center center;
  transform-style:preserve-3d;
  will-change:left,top,width,height,transform;
}

.morph-spine,
.transition-cover,

.whiteboard-reveal{
  position:fixed;
  z-index:299;
  left:0;
  top:0;
  width:0;
  height:0;
  opacity:0;
  overflow:hidden;
  border:1px solid rgba(175,186,198,.60);
  border-radius:9px;
  background:
    linear-gradient(rgba(255,255,255,.989),rgba(255,255,255,.989)),
    radial-gradient(circle,rgba(128,149,178,.24) 0 1px,transparent 1.2px) 0 0/22px 22px;
  box-shadow:0 18px 42px rgba(20,17,45,.15);
  will-change:left,top,width,height,opacity,border-radius;
}

.morph-page{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
}

.morph-spine{
  overflow:hidden;
  border:1px solid rgba(20,20,20,.24);
  border-radius:2px 3px 3px 2px;
  box-shadow:
    inset 4px 0 rgba(255,255,255,.13),
    inset -3px 0 rgba(0,0,0,.11),
    4px 12px 22px rgba(20,15,50,.18);
}

.morph-spine-title{
  position:absolute;
  inset:18px 0;
  display:flex;
  align-items:center;
  justify-content:center;
  writing-mode:vertical-rl;
  color:var(--morphText);
  font-family:var(--morphFont,Georgia,"Times New Roman",serif);
  font-size:var(--morphSize,14px);
  font-style:var(--morphStyle,normal);
  font-weight:var(--morphWeight,700);
  line-height:1;
  letter-spacing:var(--morphLetter,.04em);
  text-transform:var(--morphCase,none);
  overflow:hidden;
}

.transition-cover{
  opacity:0;
  transform-origin:left center;
  transform:rotateY(0deg);
  border-radius:4px 10px 10px 4px;
  background:var(--cover);
  box-shadow:
    inset 8px 0 rgba(255,255,255,.12),
    inset -4px 0 rgba(0,0,0,.08),
    0 28px 56px rgba(19,14,47,.24);
}
.transition-cover::before{
  content:"";
  position:absolute;
  left:15px;
  top:0;
  bottom:0;
  width:2px;
  background:rgba(255,255,255,.18);
  box-shadow:4px 0 rgba(0,0,0,.08);
}
.transition-cover::after{
  content:attr(data-title);
  position:absolute;
  left:28px;
  right:24px;
  top:42px;
  color:var(--coverText);
  font-family:var(--morphFont,Georgia,"Times New Roman",serif);
  font-size:var(--coverFontSize,27px);
  font-style:var(--morphStyle,normal);
  font-weight:var(--morphWeight,700);
  line-height:1.02;
  letter-spacing:var(--morphLetter,-.02em);
  text-transform:var(--morphCase,none);
  word-break:break-word;
}

.morph-page{
  z-index:-1;
  opacity:0;
  transform:translateZ(-2px) scale(.92);
  border-radius:3px 9px 9px 3px;
  background:
    linear-gradient(rgba(255,255,255,.985),rgba(255,255,255,.985)),
    radial-gradient(circle,rgba(128,149,178,.22) 0 1px,transparent 1.2px) 0 0/22px 22px;
  box-shadow:0 18px 42px rgba(20,17,45,.18);
}

.shelf-view.opening .book-spine:not(.is-opening){
  filter:saturate(.75) brightness(.80);
  transform:translateY(var(--lift)) rotate(var(--tilt)) scale(.985);
}
.shelf-view.opening .shelf-header,
.shelf-view.opening .shelf-board{
  filter:saturate(.8) brightness(.84);
}

.reader-panel-head,

/* ===== SHELF MICRO-INTERACTIONS ===== */
.books{
  --hover-lift: 10px;
}

.book-spine{
  cursor:pointer;
  touch-action:manipulation;
  transition:
    transform 180ms cubic-bezier(.22,.8,.25,1),
    filter 160ms ease,
    box-shadow 180ms ease,
    opacity 160ms ease !important;
  will-change:transform,filter;
}

.book-spine:hover,
.book-spine:focus-visible{
  transform:translateY(calc(var(--lift) - var(--hover-lift))) scale(1.012) !important;
  filter:brightness(1.035) saturate(1.03);
  box-shadow:
    0 18px 30px rgba(12,9,70,.22),
    0 4px 8px rgba(12,9,70,.12) !important;
  z-index:20;
}

.book-spine:focus-visible{
  outline:2px solid rgba(255,255,255,.95);
  outline-offset:4px;
}

.book-spine.is-pressed{
  transform:translateY(calc(var(--lift) - 4px)) scale(.985) !important;
  transition-duration:80ms !important;
}

.books.has-hover .book-spine:not(.is-hovered):not(.is-opening){
  filter:brightness(.94) saturate(.93);
}

.book-spine.is-hovered + .book-spine{
  transform:translateX(3px) !important;
}
.book-spine:has(+ .book-spine.is-hovered){
  transform:translateX(-3px) !important;
}

.book-spine.is-opening{
  opacity:0;
  pointer-events:none;
}

/* small shelf contact shadow that appears when a book is pulled out */
.book-spine::after{
  content:"";
  position:absolute;
  left:10%;
  right:10%;
  bottom:-8px;
  height:8px;
  border-radius:50%;
  background:rgba(8,7,55,.22);
  filter:blur(5px);
  opacity:0;
  pointer-events:none;
  transition:opacity 160ms ease;
}
.book-spine:hover::after,
.book-spine:focus-visible::after{
  opacity:.65;
}
.book-spine.image-book::after{
  display:block !important;
}

/* modal/button tactile states */
.add-book-btn,
.reader-action,
.reader-head button{
  transition:transform 120ms ease, box-shadow 160ms ease, filter 160ms ease;
}
.add-book-btn:hover,
.reader-action:hover,
.reader-head button:hover{
  transform:translateY(-1px);
  filter:brightness(1.02);
}
.add-book-btn:active,
.reader-action:active,
.reader-head button:active{
  transform:translateY(1px) scale(.985);
}

/* keep motion comfortable */
@media (prefers-reduced-motion: reduce){
  .book-spine,
  .book-spine::after,
  .add-book-btn,
  .reader-action,
  .reader-head button{
    transition:none !important;
  }
}

.shelf-board::before,

/* Soft floor shadow only; the shelf itself should stay visibly transparent. */
.shelf-shadow{
  z-index:1;
  left:9% !important;
  right:9% !important;
  bottom:-9px !important;
  height:18px !important;
  background:rgba(1,5,70,.16) !important;
  filter:blur(13px) !important;
  opacity:.72;
}

/* Very short colored reflections like the supplied reference composite. */
.book-spine.image-book{
  -webkit-box-reflect:
    below 2px
    linear-gradient(to bottom, rgba(255,255,255,.22) 0%, rgba(255,255,255,.07) 5%, transparent 13%);
}

/* Contact is crisp in the reference; don't let the hover shadow turn into a black pedestal. */
.book-spine.image-book:not(:hover):not(:focus-visible){
  filter:drop-shadow(0 2px 1px rgba(7,7,70,.12));
}

</style>
</head>
<body>

<section class="shelf-view" id="shelfView">
  <header class="shelf-header">
    <div class="brand">
      <h1>bbyspine.memo</h1>
      <p>your tiny archive. every book is a place to collect images, scraps and things you don't want to forget.</p>
    </div>
    <button class="add-book-btn" id="openAddBook"><span>＋</span> add book</button>
  </header>

  <main class="library">
    <div class="shelf-wrap">
      <div class="books" id="books"></div>
      <div class="shelf-board"></div>
      <div class="shelf-shadow"></div>
      <div class="empty-shelf" id="emptyShelf">add your first book.</div>
    </div>
  </main>
</section>

<div class="backdrop" id="addBackdrop"></div>
<div class="add-modal" id="addModal">
  <div class="modal-head">
    <small>book catalog</small>
    <h2>which book should join the shelf?</h2>
  </div>
  <div class="modal-body">
    <div class="book-catalog" id="bookCatalog"></div>
    <div class="modal-actions">
      <button id="cancelBook">cancel</button>
      <button class="primary" id="createBook" disabled>add to shelf →</button>
    </div>
  </div>
</div>

<div class="book-transition" id="bookTransition">
  <div class="transition-dim" id="transitionDim"></div>
  <div class="whiteboard-reveal" id="whiteboardReveal"></div>
  <div class="transition-book" id="transitionBook">
    <div class="morph-page" id="morphPage"></div>
    <div class="morph-spine" id="morphSpine">
      <span class="morph-spine-title" id="morphSpineTitle"></span>
    </div>
    <div class="transition-cover" id="transitionCover"></div>
  </div>
</div>

<section class="reader" id="reader">
  <div class="reader-head">
    <button id="closeBook">✕</button>
    <div class="reader-title" id="readerTitle"></div>
    <span></span>
  </div>

  <div class="reader-actions">
    <button class="reader-action primary" id="readerStickerBtn">＋ sticker</button>
    <button class="reader-action" id="readerUploadBtn">↥ upload image</button>
  </div>
  <button class="reader-remove" id="readerRemove">× remove</button>

  <aside class="reader-panel" id="readerPanel">
    <div class="reader-panel-head">
      <span>sticker collection</span>
      <button id="closeReaderPanel">×</button>
    </div>
    <div class="reader-grid" id="readerGrid"></div>
  </aside>

  <div class="whiteboard-viewport" id="boardViewport">
    <div class="book-canvas" id="bookCanvas"></div>
  </div>
</section>

<div class="upload-modal" id="uploadModal">
  <div class="upload-head">
    <div class="upload-heading">
      <h3>add an image</h3>
      <p>turn it into a draggable piece for this board.</p>
    </div>
    <button type="button" id="uploadClose" aria-label="close upload">×</button>
  </div>
  <div class="upload-body">
    <label class="upload-drop" id="uploadDrop">
      <div>
        <b>drop image here</b>
        <span>or click to browse PNG / JPG / WEBP</span>
      </div>
      <input type="file" id="uploadInput" accept="image/png,image/jpeg,image/webp">
    </label>

    <div class="upload-preview" id="uploadPreview">
      <div><img id="uploadImage" alt="preview"></div>
      <div class="upload-options">
        <label>caption
          <input id="uploadCaption" maxlength="40" placeholder="optional">
        </label>
        <label>style
          <div style="display:flex;gap:6px;margin-top:6px">
            <button type="button" id="stylePhoto" class="primary">photo card</button>
            <button type="button" id="styleRaw">plain image</button>
          </div>
        </label>
      </div>
    </div>

    <div class="upload-actions">
      <button id="cancelUpload">cancel</button>
      <button class="primary" id="confirmUpload">add to board →</button>
    </div>
  </div>
</div>

function hashBook(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h,16777619);
  }
  return h>>>0;
}

function spineMetrics(i,book){
  const title=book.title;
  const seed=hashBook(book.id+"|"+title);
  const widths=[32,38,43,48,54,59,65,45,36];
  const heights=[400];
  const font=BOOK_FONTS[seed%BOOK_FONTS.length];

  const isImageBook = !!book.image;

  let w = isImageBook && book.width ? book.width : widths[(seed+i)%widths.length];
  let h = isImageBook && book.height ? book.height : heights[(seed>>>3)%heights.length];

  // Wide image-spines (PALM / BBY types) should not become chunky.
  // Keep source ratio, cap visual width at 70px and allow height to drop,
  // but never below 320px.
  if(isImageBook && w > 70){
    const ratio = w / h;
    h = Math.max(320, Math.round(70 / ratio));
    w = Math.round(h * ratio);

    // Hard cap safeguard. This may shave a couple px from the minimum-height case.
    if(w > 70){
      w = 70;
      h = Math.round(w / ratio);
    }
  }

  return {
    w,
    h,
    tilt:0,
    lift:0,
    fs:title.length>23 ? 10 : title.length>16 ? 11 : title.length>10 ? 13 : 15,
    font:font.font,
    fontStyle:font.style,
    fontWeight:font.weight,
    letter:font.letter,
    caseStyle:font.case,
    lineHeight:font.line,
    horizontal:isImageBook ? false : (((seed>>>9)%7===0) || ((seed>>>11)%9===2 && title.length<18))
  };
}

function renderBooks(){
  booksEl.innerHTML="";
  emptyShelf.style.display=books.length ? "none" : "block";

  books.forEach((book,i)=>{
    const m=spineMetrics(i,book);
    const el=document.createElement("button");
    el.className="book-spine" + (m.horizontal ? " horizontal":"");
    el.dataset.bookId = book.id;
    el.dataset.pattern = book.pattern || "grid";
    el.style.setProperty("--w",m.w+"px");
    el.style.setProperty("--h",m.h+"px");
    el.style.setProperty("--tilt",m.tilt+"deg");
    el.style.setProperty("--lift",m.lift+"px");
    el.style.setProperty("--fs",m.fs+"px");
    el.style.setProperty("--font",m.font);
    el.style.setProperty("--fontStyle",m.fontStyle);
    el.style.setProperty("--fontWeight",m.fontWeight);
    el.style.setProperty("--letter",m.letter);
    el.style.setProperty("--case",m.caseStyle);
    el.style.setProperty("--lineHeight",m.lineHeight);
    el.style.setProperty("--txt",book.text);

    if(book.image){
      el.classList.add("image-book");
      el.style.backgroundImage = `url("${book.image}")`;
      el.style.backgroundColor = "transparent";
      el.innerHTML = "";
    }else{
      el.style.backgroundColor = book.color;
      const badge = book.badge ? `<span class="badge">${escapeHtml(book.badge)}</span>` : "";
      const band = (book.pattern === "split" || book.pattern === "paper" || book.pattern === "collage")
        ? `<span class="band"></span>${book.pattern === "collage" ? '<span class="band alt"></span>' : ''}`
        : "";
      el.innerHTML = `${badge}<span class="spine-title">${escapeHtml(book.title)}</span><span class="spine-year">${new Date().getFullYear()}</span>${band}`;
    }

    el.type="button";
    el.setAttribute("aria-label",`open ${book.title}`);

    el.addEventListener("pointerenter",()=>{
      el.classList.add("is-hovered");
      booksEl.classList.add("has-hover");
    });
    el.addEventListener("pointerleave",()=>{
      el.classList.remove("is-hovered","is-pressed");
      if(!booksEl.querySelector(".is-hovered")) booksEl.classList.remove("has-hover");
    });
    el.addEventListener("pointerdown",()=>el.classList.add("is-pressed"));
    el.addEventListener("pointerup",()=>el.classList.remove("is-pressed"));
    el.addEventListener("pointercancel",()=>el.classList.remove("is-pressed"));

    el.addEventListener("keydown",(e)=>{
      if(e.key==="ArrowRight" || e.key==="ArrowLeft"){
        e.preventDefault();
        const books=[...booksEl.querySelectorAll(".book-spine")];
        const idx=books.indexOf(el);
        const next=e.key==="ArrowRight"
          ? books[(idx+1)%books.length]
          : books[(idx-1+books.length)%books.length];
        next?.focus();
      }
    });

    el.addEventListener("click",async()=>{
      if(transition.classList.contains("run")) return;
      el.classList.remove("is-pressed");
      if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
        const press=el.animate(
          [
            {transform:"translateY(-10px) scale(1.012)"},
            {transform:"translateY(-5px) scale(.992)"},
            {transform:"translateY(-12px) scale(1.006)"}
          ],
          {duration:150,easing:"cubic-bezier(.2,.8,.2,1)"}
        );
        await press.finished.catch(()=>{});
      }
      openBook(book, el);
    });
    booksEl.appendChild(el);
  });
}

}

function escapeHtml(v){
  return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function openBookModal(){
  selectedCatalogBookId=null;
  renderBookCatalog();
  addBackdrop.classList.add("open");
  addModal.classList.add("open");
}
function closeBookModal(){
  addBackdrop.classList.remove("open");
  addModal.classList.remove("open");
}
openAddBook.onclick=openBookModal;
cancelBook.onclick=closeBookModal;
addBackdrop.onclick=closeBookModal;

function renderBookCatalog(){
  const displayedIds=new Set(books.map(book=>book.id));
  const available=BOOK_CATALOG.filter(book=>!displayedIds.has(book.id));
  bookCatalog.innerHTML="";
  createBook.disabled=true;

  if(!available.length){
    bookCatalog.innerHTML='<div class="catalog-empty">all books are already on the shelf.</div>';
    return;
  }

  available.forEach(book=>{
    const option=document.createElement("button");
    option.type="button";
    option.className="catalog-book";
    option.innerHTML=`<span class="catalog-cover"></span><span class="catalog-title">${escapeHtml(book.title)}</span>`;
    const cover=option.querySelector(".catalog-cover");
    cover.style.backgroundColor=book.color || "#252832";
    if(book.image) cover.style.backgroundImage=`url("${book.image}")`;
    option.onclick=()=>{
      bookCatalog.querySelectorAll(".catalog-book").forEach(el=>el.classList.remove("active"));
      option.classList.add("active");
      selectedCatalogBookId=book.id;
      createBook.disabled=false;
    };
    bookCatalog.appendChild(option);
  });
}

createBook.onclick=()=>{
  const book=BOOK_CATALOG.find(item=>item.id===selectedCatalogBookId);
  if(!book || books.some(item=>item.id===book.id)) return;
  books.push({...book});
  saveBooks();
  renderBooks();
  closeBookModal();
};

function waitAnim(anim){
  return anim.finished.catch(()=>{});
}

function applyTransitionBookStyle(book, sourceEl){
  const sourceStyle=getComputedStyle(sourceEl);
  const titleEl=sourceEl.querySelector(".spine-title");
  const titleStyle=titleEl ? getComputedStyle(titleEl) : null;

  transitionCover.style.setProperty("--cover",book.color || "#f4f1e8");
  transitionCover.style.setProperty("--coverText",book.text || "#111");
  transitionCover.style.backgroundColor=book.color || "transparent";
  transitionCover.style.backgroundImage=sourceStyle.backgroundImage;
  transitionCover.style.backgroundSize=sourceStyle.backgroundSize;
  transitionCover.style.backgroundPosition=sourceStyle.backgroundPosition;
  transitionCover.style.backgroundRepeat=sourceStyle.backgroundRepeat;
  transitionCover.dataset.title=book.title;

  morphSpine.style.backgroundColor=book.color || "transparent";
  morphSpine.style.backgroundImage=sourceStyle.backgroundImage;
  morphSpine.style.backgroundSize=sourceStyle.backgroundSize;
  morphSpine.style.backgroundPosition=sourceStyle.backgroundPosition;
  morphSpine.style.backgroundRepeat=sourceStyle.backgroundRepeat;
  morphSpine.style.setProperty("--morphText",book.text || "#111");
  morphSpineTitle.textContent=book.title;

  transitionBook.style.setProperty("--morphFont", titleStyle?.fontFamily || 'Georgia, "Times New Roman", serif');
  transitionBook.style.setProperty("--morphStyle", titleStyle?.fontStyle || "italic");
  transitionBook.style.setProperty("--morphWeight", titleStyle?.fontWeight || "400");
  transitionBook.style.setProperty("--morphLetter", titleStyle?.letterSpacing || "-.02em");
  transitionBook.style.setProperty("--morphCase", titleStyle?.textTransform || "none");
  transitionBook.style.setProperty("--morphSize", titleStyle?.fontSize || "14px");
}

function cleanupTransitionAnimations(){
  [
    transitionDim,
    whiteboardReveal,
    transitionBook,
    morphSpine,
    morphPage,
    transitionCover,
    reader
  ].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
}

async function openBook(book, sourceEl){
  if(transition.classList.contains("run")) return;

  activeBook=book;
  lastOpenedBookEl=sourceEl;
  const rect=sourceEl.getBoundingClientRect();
  applyTransitionBookStyle(book,sourceEl);

  sourceEl.classList.add("is-opening");
  shelfView.classList.add("opening");
  transition.classList.add("run");

  morphSpine.style.opacity="1";
  transitionCover.style.opacity="0";
  morphPage.style.opacity="0";
  whiteboardReveal.style.opacity="0";

  transitionBook.style.left=rect.left+"px";
  transitionBook.style.top=rect.top+"px";
  transitionBook.style.width=rect.width+"px";
  transitionBook.style.height=rect.height+"px";

  const vw=window.innerWidth;
  const vh=window.innerHeight;
  const targetW=Math.min(272,vw*.27);
  const targetH=Math.min(382,vh*.52);
  const targetL=(vw-targetW)/2;
  const targetT=(vh-targetH)/2;

  // subtle shelf reaction instead of instantly dimming everything
  const prev=sourceEl.previousElementSibling;
  const next=sourceEl.nextElementSibling;
  const neighborAnims=[];
  if(prev) neighborAnims.push(prev.animate(
    [{transform:getComputedStyle(prev).transform},{transform:"translateX(-5px)"}],
    {duration:190,fill:"forwards",easing:"ease-out"}
  ));
  if(next) neighborAnims.push(next.animate(
    [{transform:getComputedStyle(next).transform},{transform:"translateX(5px)"}],
    {duration:190,fill:"forwards",easing:"ease-out"}
  ));

  const dimAnim=transitionDim.animate([
    {background:"rgba(19,12,86,0)",backdropFilter:"blur(0px)"},
    {background:"rgba(19,12,86,.12)",backdropFilter:"blur(1.5px)"}
  ],{
    duration:620,
    fill:"forwards",
    easing:"cubic-bezier(.2,.7,.2,1)"
  });

  // 01. pull out: very short + physical
  await waitAnim(transitionBook.animate([
    {
      left:rect.left+"px",top:rect.top+"px",
      width:rect.width+"px",height:rect.height+"px",
      transform:"translate3d(0,0,0) rotateY(0deg) rotateZ(0deg)"
    },
    {
      left:(rect.left-4)+"px",top:(rect.top-11)+"px",
      width:rect.width+"px",height:rect.height+"px",
      transform:"translate3d(0,0,72px) rotateY(-5deg) rotateZ(-.6deg)"
    }
  ],{
    duration:155,
    fill:"forwards",
    easing:"cubic-bezier(.16,.9,.25,1)"
  }));

  // 02. move to center and widen naturally. Tiny overshoot, then settle.
  const travel=transitionBook.animate([
    {
      left:(rect.left-4)+"px",top:(rect.top-11)+"px",
      width:rect.width+"px",height:rect.height+"px",
      transform:"translate3d(0,0,72px) rotateY(-5deg) rotateZ(-.6deg)"
    },
    {
      left:(targetL-6)+"px",top:(targetT+2)+"px",
      width:(targetW+12)+"px",height:(targetH+5)+"px",
      transform:"translate3d(0,0,12px) rotateY(-2deg) rotateZ(.5deg)",
      offset:.82
    },
    {
      left:targetL+"px",top:targetT+"px",
      width:targetW+"px",height:targetH+"px",
      transform:"translate3d(0,0,0) rotateY(0deg) rotateZ(0deg)"
    }
  ],{
    duration:410,
    fill:"forwards",
    easing:"cubic-bezier(.18,.82,.18,1)"
  });

  const spineToCover=morphSpine.animate([
    {opacity:1,transform:"scaleX(1)"},
    {opacity:1,transform:"scaleX(.92)",offset:.50},
    {opacity:0,transform:"scaleX(.82)"}
  ],{
    duration:410,
    fill:"forwards",
    easing:"cubic-bezier(.32,0,.2,1)"
  });

  const revealCover=transitionCover.animate([
    {opacity:0,transform:"scaleX(.78)",transformOrigin:"left center"},
    {opacity:0,transform:"scaleX(.84)",offset:.43},
    {opacity:1,transform:"scaleX(1)"}
  ],{
    duration:410,
    fill:"forwards",
    easing:"cubic-bezier(.2,.74,.2,1)"
  });

  await Promise.all([
    waitAnim(travel),
    waitAnim(spineToCover),
    waitAnim(revealCover)
  ]);

  // Prepare real board but keep it invisible until the page expansion starts.
  readerTitle.innerHTML='<span>'+escapeHtml(book.title)+'</span>';
  reader.classList.add("open");
  reader.style.opacity="0";
  restoreBoard();
  boardPanX=0;
  boardPanY=0;
  boardZoomLevel=1.0;
  applyBoardZoom();

  // reveal starts as an inner page, not a giant scaled child
  const revealInset=12;
  whiteboardReveal.style.left=(targetL+revealInset)+"px";
  whiteboardReveal.style.top=(targetT+8)+"px";
  whiteboardReveal.style.width=(targetW-revealInset)+"px";
  whiteboardReveal.style.height=(targetH-16)+"px";
  whiteboardReveal.style.opacity="1";

  // 03. cover opens a restrained amount while the board grows out from inside.
  const coverOpen=transitionCover.animate([
    {transform:"rotateY(0deg)",filter:"brightness(1)"},
    {transform:"rotateY(-18deg)",offset:.26},
    {transform:"rotateY(-74deg)",offset:.78},
    {transform:"rotateY(-82deg)",filter:"brightness(.96)"}
  ],{
    duration:360,
    fill:"forwards",
    easing:"cubic-bezier(.22,.74,.18,1)"
  });

  const boardExpand=whiteboardReveal.animate([
    {
      left:(targetL+revealInset)+"px",
      top:(targetT+8)+"px",
      width:(targetW-revealInset)+"px",
      height:(targetH-16)+"px",
      borderRadius:"8px",
      opacity:1
    },
    {
      left:"18px",
      top:"18px",
      width:(vw-36)+"px",
      height:(vh-36)+"px",
      borderRadius:"5px",
      offset:.78
    },
    {
      left:"0px",
      top:"0px",
      width:vw+"px",
      height:vh+"px",
      borderRadius:"0px",
      opacity:1
    }
  ],{
    duration:470,
    fill:"forwards",
    easing:"cubic-bezier(.18,.76,.18,1)"
  });

  const readerFade=reader.animate([
    {opacity:0},
    {opacity:0,offset:.48},
    {opacity:1}
  ],{
    duration:470,
    fill:"forwards",
    easing:"ease-out"
  });

  await Promise.all([
    waitAnim(coverOpen),
    waitAnim(boardExpand),
    waitAnim(readerFade),
    waitAnim(dimAnim)
  ]);

  // dissolve the temporary whiteboard exactly when the real one is visible
  await waitAnim(whiteboardReveal.animate(
    [{opacity:1},{opacity:0}],
    {duration:100,fill:"forwards",easing:"linear"}
  ));

  reader.style.opacity="";
  transition.classList.remove("run");
  setTimeout(()=>closeBook.focus({preventScroll:true}),40);
  shelfView.classList.remove("opening");
  shelfView.classList.add("hidden");
  sourceEl.classList.remove("is-opening");

  neighborAnims.forEach(a=>a.cancel());
  cleanupTransitionAnimations();
}

closeBook.onclick=async()=>{
  persistBoard();
  readerPanel.classList.remove("open");
  selectedObject=null;
  readerRemove.classList.remove("show");

  const target=document.querySelector(`.book-spine[data-book-id="${activeBook?.id}"]`);
  if(!target){
    reader.classList.remove("open");
    shelfView.classList.remove("hidden");
    return;
  }

  const rect=target.getBoundingClientRect();
  applyTransitionBookStyle(activeBook,target);

  const vw=window.innerWidth;
  const vh=window.innerHeight;
  const targetW=Math.min(272,vw*.27);
  const targetH=Math.min(382,vh*.52);
  const targetL=(vw-targetW)/2;
  const targetT=(vh-targetH)/2;

  transition.classList.add("run");
  shelfView.classList.remove("hidden");
  shelfView.classList.add("opening");

  // start with the current whiteboard duplicated above the reader
  whiteboardReveal.style.left="0px";
  whiteboardReveal.style.top="0px";
  whiteboardReveal.style.width=vw+"px";
  whiteboardReveal.style.height=vh+"px";
  whiteboardReveal.style.opacity="1";

  transitionBook.style.left=targetL+"px";
  transitionBook.style.top=targetT+"px";
  transitionBook.style.width=targetW+"px";
  transitionBook.style.height=targetH+"px";
  morphSpine.style.opacity="0";
  transitionCover.style.opacity="1";
  transitionCover.style.transform="rotateY(-82deg)";

  const innerLeft=targetL+12;
  const innerTop=targetT+8;
  const innerW=targetW-12;
  const innerH=targetH-16;

  const readerFade=reader.animate(
    [{opacity:1},{opacity:0}],
    {duration:210,fill:"forwards",easing:"ease-in"}
  );

  const boardContract=whiteboardReveal.animate([
    {
      left:"0px",top:"0px",
      width:vw+"px",height:vh+"px",
      borderRadius:"0px"
    },
    {
      left:"18px",top:"18px",
      width:(vw-36)+"px",height:(vh-36)+"px",
      borderRadius:"5px",
      offset:.20
    },
    {
      left:innerLeft+"px",top:innerTop+"px",
      width:innerW+"px",height:innerH+"px",
      borderRadius:"8px"
    }
  ],{
    duration:400,
    fill:"forwards",
    easing:"cubic-bezier(.32,.02,.22,1)"
  });

  const coverClose=transitionCover.animate([
    {transform:"rotateY(-82deg)"},
    {transform:"rotateY(-68deg)",offset:.2},
    {transform:"rotateY(-14deg)",offset:.76},
    {transform:"rotateY(0deg)"}
  ],{
    duration:360,
    fill:"forwards",
    easing:"cubic-bezier(.35,.04,.22,1)"
  });

  await Promise.all([
    waitAnim(readerFade),
    waitAnim(boardContract),
    waitAnim(coverClose)
  ]);

  reader.classList.remove("open");
  reader.style.opacity="";

  // page disappears into closed cover
  whiteboardReveal.style.opacity="0";

  // 04. shrink front cover into spine while returning to exact shelf position
  const coverToSpine=transitionCover.animate([
    {opacity:1,transform:"scaleX(1)"},
    {opacity:.92,transform:"scaleX(.9)",offset:.42},
    {opacity:0,transform:"scaleX(.78)"}
  ],{
    duration:390,
    fill:"forwards",
    easing:"cubic-bezier(.32,0,.22,1)"
  });

  const spineReveal=morphSpine.animate([
    {opacity:0,transform:"scaleX(.82)"},
    {opacity:0,offset:.36},
    {opacity:1,transform:"scaleX(1)"}
  ],{
    duration:390,
    fill:"forwards",
    easing:"ease-out"
  });

  const travelBack=transitionBook.animate([
    {
      left:targetL+"px",top:targetT+"px",
      width:targetW+"px",height:targetH+"px",
      transform:"translate3d(0,0,0) rotateY(0deg)"
    },
    {
      left:(rect.left-5)+"px",top:(rect.top-10)+"px",
      width:rect.width+"px",height:rect.height+"px",
      transform:"translate3d(0,0,55px) rotateY(-5deg) rotateZ(-.4deg)",
      offset:.83
    },
    {
      left:rect.left+"px",top:rect.top+"px",
      width:rect.width+"px",height:rect.height+"px",
      transform:"translate3d(0,0,0) rotateY(0deg) rotateZ(0deg)"
    }
  ],{
    duration:470,
    fill:"forwards",
    easing:"cubic-bezier(.3,.05,.2,1)"
  });

  await Promise.all([
    waitAnim(coverToSpine),
    waitAnim(spineReveal),
    waitAnim(travelBack)
  ]);

  transition.classList.remove("run");
  shelfView.classList.remove("opening");
  cleanupTransitionAnimations();
  setTimeout(()=>lastOpenedBookEl?.focus({preventScroll:true}),40);
};

function persistBoard(){
  if(!activeBook) return;
  bookCanvas.querySelectorAll(".canvas-object").forEach(el=>el.classList.remove("selected"));
  localStorage.setItem(boardKey(activeBook.id),bookCanvas.innerHTML);
  if(selectedObject) selectedObject.classList.add("selected");
}

function restoreBoard(){
  selectedObject=null;
  readerRemove.classList.remove("show");
  const saved=localStorage.getItem(boardKey(activeBook.id));
  bookCanvas.innerHTML=saved||"";
  bookCanvas.querySelectorAll(".canvas-object").forEach(el=>{
    el.dataset.bound="";
    bindObject(el);
  });
}

function selectObject(el){
  if(selectedObject) selectedObject.classList.remove("selected");
  selectedObject=el;
  if(el){
    el.classList.add("selected");
    readerRemove.classList.add("show");
  }else{
    readerRemove.classList.remove("show");
  }
}

function bindObject(el){
  if(el.dataset.bound==="1") return;
  el.dataset.bound="1";
  el.addEventListener("click",e=>{e.stopPropagation();selectObject(el)});
  el.addEventListener("pointerdown",e=>{
    e.stopPropagation();selectObject(el);
    el.setPointerCapture(e.pointerId);
    el.classList.add("dragging");
    const sx=e.clientX,sy=e.clientY;
    const sl=parseFloat(el.style.left)||0;
    const st=parseFloat(el.style.top)||0;

    const move=ev=>{
      el.style.left=sl+(ev.clientX-sx)+"px";
      el.style.top=st+(ev.clientY-sy)+"px";
    };
    const up=()=>{
      el.classList.remove("dragging");
      el.removeEventListener("pointermove",move);
      el.removeEventListener("pointerup",up);
      persistBoard();
    };
    el.addEventListener("pointermove",move);
    el.addEventListener("pointerup",up);
  });
}
bookCanvas.addEventListener("click",()=>selectObject(null));

boardViewport.addEventListener("mousedown", function (e) {
  if (e.button !== 0) return;
  if (e.target.closest("button, a, input, select, textarea, .canvas-object")) return;
  isBoardDragging = true;
  boardStartX = e.clientX - boardPanX;
  boardStartY = e.clientY - boardPanY;
  boardViewport.style.cursor = "grabbing";
});

window.addEventListener("mousemove", function (e) {
  if (!isBoardDragging) return;
  boardPanX = e.clientX - boardStartX;
  boardPanY = e.clientY - boardStartY;
  applyBoardZoom();
});

window.addEventListener("mouseup", function () {
  if (isBoardDragging) {
    isBoardDragging = false;
    boardViewport.style.cursor = "grab";
  }
});

boardViewport.addEventListener("wheel", function (e) {
  if (!e.ctrlKey) return;
  e.preventDefault();
  const zoomFactor = 1.1;
  if (e.deltaY < 0) {
    boardZoomLevel = Math.min(2.5, boardZoomLevel * zoomFactor);
  } else {
    boardZoomLevel = Math.max(0.4, boardZoomLevel / zoomFactor);
  }
  applyBoardZoom();
}, { passive: false });

readerRemove.onclick=()=>{
  if(!selectedObject)return;
  selectedObject.remove();
  selectedObject=null;
  readerRemove.classList.remove("show");
  persistBoard();
};

function addSticker(src){
  const el=document.createElement("div");
  el.className="canvas-object";
  const cx = 1700 - boardPanX / boardZoomLevel;
  const cy = 1300 - boardPanY / boardZoomLevel;
  el.style.left = (cx + (Math.random()*180-90)) + "px";
  el.style.top = (cy + (Math.random()*140-70)) + "px";
  el.style.transform=`rotate(${Math.round(Math.random()*10-5)}deg)`;
  el.innerHTML=`<img src="${src}" alt="sticker">`;
  bookCanvas.appendChild(el);
  bindObject(el);
  selectObject(el);
  persistBoard();
}

readerStickerBtn.onclick=()=>readerPanel.classList.toggle("open");
closeReaderPanel.onclick=()=>readerPanel.classList.remove("open");

Object.entries(STICKERS).forEach(([name,src])=>{
  const btn=document.createElement("button");
  btn.className="reader-sticker";
  btn.innerHTML=`<img src="${src}" alt="${name}">`;
  btn.onclick=()=>{addSticker(src);readerPanel.classList.remove("open")};
  readerGrid.appendChild(btn);
});

/* uploader */
readerUploadBtn.onclick=()=>{
  uploadedData="";
  uploadInput.value="";
  uploadCaption.value="";
  uploadImage.removeAttribute("src");
  uploadPreview.classList.remove("show");
  uploadModal.classList.add("open");
};
cancelUpload.onclick=()=>uploadModal.classList.remove("open");
uploadClose.onclick=()=>uploadModal.classList.remove("open");

function fileToData(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}
async function handleUpload(file){
  if(!file||!file.type.startsWith("image/"))return;
  uploadedData=await fileToData(file);
  uploadImage.src=uploadedData;
  uploadPreview.classList.add("show");
}
uploadInput.onchange=e=>handleUpload(e.target.files?.[0]);
uploadDrop.ondragover=e=>e.preventDefault();
uploadDrop.ondrop=e=>{e.preventDefault();handleUpload(e.dataTransfer.files?.[0])};

stylePhoto.onclick=()=>{uploadStyle="photo";stylePhoto.classList.add("primary");styleRaw.classList.remove("primary")};
styleRaw.onclick=()=>{uploadStyle="raw";styleRaw.classList.add("primary");stylePhoto.classList.remove("primary")};

confirmUpload.onclick=()=>{
  if(!uploadedData)return;
  const el=document.createElement("div");
  el.className="canvas-object "+(uploadStyle==="photo"?"upload-photo":"");
  const cx = 1700 - boardPanX / boardZoomLevel;
  const cy = 1300 - boardPanY / boardZoomLevel;
  el.style.left = (cx - 80) + "px";
  el.style.top = (cy - 60) + "px";
  el.style.transform=`rotate(${Math.round(Math.random()*6-3)}deg)`;

  const cap=escapeHtml(uploadCaption.value.trim());
  el.innerHTML=`<img src="${uploadedData}" alt="uploaded">${cap?`<div style="margin-top:4px;text-align:center;color:#766d66;font:italic 8px Georgia,serif">${cap}</div>`:""}`;
  bookCanvas.appendChild(el);
  bindObject(el);
  selectObject(el);
  persistBoard();
  uploadModal.classList.remove("open");
};

document.addEventListener("keydown",e=>{
  if((e.key==="Delete"||e.key==="Backspace")&&selectedObject&&reader.classList.contains("open")){
    e.preventDefault();
    readerRemove.click();
  }
  if(e.key==="Escape"){
    if(uploadModal.classList.contains("open")) uploadModal.classList.remove("open");
    else if(reader.classList.contains("open")) closeBook.click();
    else if(addModal.classList.contains("open")) closeBookModal();
  }
});


document.addEventListener("keydown",(e)=>{
  if(e.key!=="Escape") return;

  if(addModal.classList.contains("open")){
    closeBookModal();
    openAddBook.focus();
    return;
  }

  if(reader.classList.contains("open") && !transition.classList.contains("run")){
    closeBook.click();
  }
});

renderBooks();
